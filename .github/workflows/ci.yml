name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # Lets the workflow be run by hand from the Actions tab.
  workflow_dispatch:

jobs:
  verify:
    name: Type-check, lint, build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Playwright builds the site itself via the webServer config, so the
      # build is exercised as part of the test run rather than twice.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
